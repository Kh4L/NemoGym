[project]
name = "sglang-model"
version = "0.2.0rc0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    # Local prompt rendering must match the NeMo-RL SGLang tokenizer version.
    # Updated September 18, 2026. License: Apache-2.0.
    "transformers==5.12.1",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["sglang_model"]

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }
