# Native /generate transport with exact sampled-token echo for training.
# model/tokenizer and context_length must match the SGLang policy server.
policy_model:
  responses_api_models:
    sglang_model:
      entrypoint: app.py
      transport: generate
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      context_length: ???
      return_token_id_information: true
      uses_reasoning_parser: true
      sglang_tool_format: hermes
